# electron-builder config for the Undisclosed desktop app.
# Built after `theia build` (see the dist* scripts). Produces installers under
# apps/desktop/dist. May need per-OS tuning on the first real packaging run —
# see docs/PACKAGING.md.
appId: ai.undisclosed.app
productName: Undisclosed
copyright: Copyright © 2026 Simon Ugorji

# Native modules are already rebuilt for Electron by `theia rebuild:electron`
# (npm run rebuild). Don't let electron-builder rebuild them again — it runs in a
# subprocess without our node-gyp Python and chokes on optional native deps
# (e.g. cpu-features) on Python 3.12+ (no distutils).
npmRebuild: false

directories:
  output: dist
  buildResources: build

# Theia's build emits the frontend/backend bundles under lib/ and generated
# sources under src-gen/. The electron entry is lib/backend/electron-main.js
# (package.json "main").
files:
  - lib/**
  - src-gen/**
  - package.json
  # Electron main entry wrapper (sets THEIA_DEFAULT_PLUGINS → bundled plugins).
  - electron-entry.js
  # Bundled VS Code builtin extensions (TS/JSON language servers) downloaded by
  # `theia download:plugins` into ./plugins. Theia deploys them from
  # theiaPluginsDir at runtime; without this the packaged app has no language
  # intelligence (go-to-def / references / hover) even though dev does.
  - plugins/**
  - "!**/*.ts"
  - "!**/*.map"

# electron-builder prunes any directory ending in `node_modules` from the app
# files (see app-builder-lib/out/util/AppFileWalker.js:createAppFilter) unless
# this is set. Some VS Code extensions keep a runtime dependency OUT of their
# webpack bundle and require() it at activation from their own node_modules:
# esbenp.prettier-vscode does `require("prettier")` from dist/extension.js, and
# the vsix ships it at extension/node_modules/prettier. Without this the packaged
# app activates the plugin and throws "Cannot find module 'prettier'" (the dir is
# simply absent under Resources/app/plugins/.../extension/node_modules).
# Files inside those node_modules still have to match a positive `files` pattern
# (here `plugins/**`), so the app's own top-level node_modules is NOT swept in.
includeSubNodeModules: true

# The frozen Python brain (scripts/build-brain.sh → brain/dist/undisclosed-brain
# or .exe). BrainLauncher resolves it at <resources>/brain/ in the packaged app.
extraResources:
  - from: "../../brain/dist"
    to: "brain"
    filter:
      - "undisclosed-brain*"

# asar disabled: Theia's plugin host + our agent backend serve files with
# express.static (which can't read from inside an asar archive), and several
# native modules (node-pty, ripgrep) also dislike asar. Larger/slower to unpack
# but reliable — revisit with asarUnpack once a build is green.
asar: false

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # Local unsigned build (no Apple cert): produce an installable .dmg without
  # signing. Gatekeeper will warn on first open — right-click → Open, or run
  #   xattr -cr /Applications/Undisclosed.app
  # Set an identity + hardenedRuntime:true later when notarizing for release.
  identity: null
  # macOS App Nap opt-out. Without this the OS may silently NAP the app once it
  # is idle (or its window is occluded / hidden fullscreen): a napped process
  # stops running timers, so socket.io's heartbeat and Theia's 5s connection
  # ping miss their deadlines and the status bar flips to
  # "Offline - Cannot connect to backend." even though nothing is actually wrong.
  # NSAppSleepDisabled tells macOS not to nap this app. `extendInfo` adds it to
  # the generated Contents/Info.plist. The runtime powerSaveBlocker in
  # electron-entry.js is the belt to this suspenders.
  extendInfo:
    NSAppSleepDisabled: true

win:
  target:
    - nsis

linux:
  target:
    - AppImage
    - deb
  category: Development
  # The .deb target requires a maintainer. Without one electron-builder fails
  # with "Please specify author 'email' in the application package.json" at the
  # packaging step (the AppImage still builds; the deb does not). Set it here
  # rather than inventing an email in the npm author field.
  maintainer: Simon Ugorji <ugorji757@gmail.com>
  # apps/desktop's npm name is the scoped "@undisclosed/desktop". electron-builder
  # derives the deb file path from ${name}, so it tried to write
  #   dist/@undisclosed/desktop_0.0.7_amd64.deb
  # and fpm aborted with
  #   "Parent directory does not exist: .../dist/@undisclosed"
  # (and the deb would also have missed the upload-artifact dist/*.deb glob).
  # Force a flat, unscoped artifact name.
  artifactName: "${productName}-${version}-${arch}.${ext}"
