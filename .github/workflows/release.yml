# Build installers on each OS's native runner and attach them to a GitHub
# Release. Cross-compiling desktop installers is painful, so each is built on its
# own runner (mirrors the pulpit-ai release flow).
#
# Trigger: push a version tag (see scripts/release.sh):
#   npm run release [patch|minor|major]
# Or run manually from the Actions tab (build-only, no Release).
#
# macOS ships for BOTH architectures: macos-15 is Apple Silicon (arm64) and
# macos-15-intel is Intel (x64). Each runner packages the host arch, so the native
# modules (node-pty, ripgrep, ...) are rebuilt for the right CPU.
#
# The agent-embed bundle (packages/undisclosed-agent/assets/agent-embed/) is
# committed to the repo and regenerated locally by scripts/release.sh before it
# tags, so CI does NOT rebuild agent-ui here: its locally patched @stackframe/react
# copy is gitignored and not reproducible from a clean checkout. CI only verifies
# the committed bundle is present.
#
# Run `scripts/preflight-ci.sh --full` before tagging to reproduce these steps
# locally and avoid burning a CI run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the Release + upload assets

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # `theia download:plugins` resolves extension packs over sockets with no
    # timeout; on the Intel macOS runner it once wedged for 1h30m+ (its log stopped
    # at "collecting extension dependencies"). The download step below is bounded,
    # but cap the whole job too so a wedged step fails in minutes, not hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # x64
          # Pin Windows to the 2022 image (VS 2022 toolchain). Do NOT use
          # windows-latest: its image now ships Visual Studio 18, which the
          # bundled node-gyp 9.4.1 cannot parse. It reports
          #   find VS unknown version "undefined" found at
          #     "C:\Program Files\Microsoft Visual Studio\18\Enterprise"
          #   find VS could not find a version of Visual Studio 2017 or newer
          # and @theia/ffmpeg's binding.gyp (win-ffmpeg.c) build dies with
          # "Could not find any Visual Studio installation to use".
          - os: windows-2022 # x64
          - os: macos-15 # Apple Silicon (arm64)
          - os: macos-15-intel # Intel (x64)
    env:
      # Don't install git hooks on CI (husky runs on `npm ci` via `prepare`).
      HUSKY: "0"
      # Authenticated GitHub requests for postinstall downloads. @vscode/ripgrep
      # pulls its prebuilt binary from GitHub releases during install; unauthenticated
      # requests share the runner IP's rate limit and fail intermittently (a very
      # likely cause of the "Install root deps" failures on windows/macos).
      GITHUB_TOKEN: ${{ github.token }}
      # Puppeteer's Chromium download is large, flaky, and unneeded here (the app
      # ships Electron, not Chromium). Skip it to remove a network failure point.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # node-gyp needs a distutils-capable Python (repo .npmrc pins
      # /usr/bin/python3, which only exists on macOS). Expose the 3.11 interpreter
      # and point npm at it via npm_config_python on the install steps below.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"

      # 1) Freeze the Python brain into a self-contained binary (no Python on the
      #    user's machine). Consumed by electron-builder via extraResources.
      - name: Install uv (provisions the brain venv from pyproject.toml)
        uses: astral-sh/setup-uv@v5
      - name: Build brain binary
        run: npm run dist:brain

      # 1b) Linux native build deps. `native-keymap` (a @theia/core dependency)
      #     compiles from source on install and its binding.gyp shells out to
      #     pkg-config for X11/xkbfile. The Ubuntu runner lacks those headers, so
      #     `npm install` in apps/desktop dies with
      #     "Package 'x11', required by 'virtual:world', not found".
      - name: Install Linux native build deps (X11/xkbfile for native-keymap)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev

      # 2) Root deps. These also supply tsc (via @theia/cli) used to compile the
      #    packages/* Theia extensions during the desktop build.
      - name: Install root deps
        run: npm ci
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}

      # 3) The agent-embed bundle ships from the repo (see header). Guard against a
      #    release tagged with it missing rather than silently rebuilding it.
      - name: Verify committed agent bundle
        shell: bash
        run: |
          test -s packages/undisclosed-agent/assets/agent-embed/agent-embed.umd.js
          test -s packages/undisclosed-agent/assets/agent-embed/style.css

      # 4) Install the desktop app's own deps (Electron, @theia/electron, the
      #    extensions) and rebuild native modules for Electron.
      - name: Install desktop app
        run: npm install
        working-directory: apps/desktop
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}
      - name: Rebuild native modules for Electron
        run: npm run rebuild
        working-directory: apps/desktop
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}

      # 5) The pinned VS Code extensions are byte-identical on every OS, so cache
      #    them across runners. The key hashes ONLY the `theiaPlugins` map, so
      #    unrelated package.json edits don't churn the cache. On a hit the step
      #    below is a ~2s no-op with zero network; on a miss it downloads and
      #    re-caches. See the script header for why that matters.
      - name: Compute VS Code plugins cache key
        id: plugins_cache
        shell: bash
        run: |
          hash="$(node -e "const p=require('./apps/desktop/package.json');const c=require('crypto');process.stdout.write(c.createHash('sha256').update(JSON.stringify(p.theiaPlugins||{})).digest('hex').slice(0,16))")"
          echo "key=theia-plugins-$hash" >> "$GITHUB_OUTPUT"
      - name: Restore VS Code plugins cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/plugins
          key: ${{ steps.plugins_cache.outputs.key }}
          restore-keys: theia-plugins-
      - name: Download VS Code plugins (bounded)
        shell: bash
        run: bash ../../scripts/ci-download-plugins.sh
        working-directory: apps/desktop

      # 6) Build the Electron Theia app (build:packages + theia build — no plugin
      #    download in here anymore) then package installers for THIS runner's OS
      #    and architecture (targets + arch come from electron-builder.yml).
      - name: Build Theia app
        run: npm run build
        working-directory: apps/desktop
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}
      - name: Package installers
        run: npm run package
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_python: ${{ steps.python.outputs.python-path }}
          # Unsigned builds: don't try to auto-discover a Developer ID identity.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # electron-builder hardlinks files on CI and throws EEXIST when the same
          # destination is written twice (builder-util fs.js fs.link()s unless
          # USE_HARD_LINKS=false). Real copies overwrite instead. This is what
          # failed the Intel macOS package step on @babel/runtime/LICENSE.
          USE_HARD_LINKS: "false"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: ignore
          # Same-run hand-off to the release job, not a kept artifact — short
          # retention so builds don't pile up against the Actions storage quota.
          retention-days: 1

  release:
    name: publish Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish installers to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
